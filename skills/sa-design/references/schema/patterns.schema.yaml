$schema: https://json-schema.org/draft/2020-12/schema
title: patterns.yaml
type: object
additionalProperties: false
required:
- patterns
properties:
  patterns:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - summary
      - steps
      properties:
        id:
          enum:
          - security
          - observability
          - resilience
        summary: &id002
          type: string
          minLength: 1
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - n
            - from
            - to
            - text
            properties:
              n:
                type: integer
                minimum: 1
              from: &id001
                type: string
                pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
              to: *id001
              text: *id002
