$schema: https://json-schema.org/draft/2020-12/schema
title: stack.yaml
type: object
additionalProperties: false
required:
- layers
properties:
  layers:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - choice
      - reason
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        name:
          type: string
          minLength: 1
        choice: &id001
          type: string
        reason: *id001
