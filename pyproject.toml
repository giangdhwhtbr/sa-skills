[project]
name = "sa-design-kit"
version = "0.3.0"
description = "Guided DDD + microservices solution design and review (Claude Code plugin)"
requires-python = ">=3.10"
dependencies = ["pyyaml", "jsonschema"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/sa-review/scripts", "skills/sa-diagrams/scripts", "skills/sa-deck/scripts"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Test tables of mutations read best one per line.
"tests/*" = ["E501"]
