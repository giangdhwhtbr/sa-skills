artifacts:
  beads: .beads
  evidence: .agent-workflow/runtime/evidence
  knowledge: .planning/knowledge
  layout: sdd
  plans: .planning/plans
  runtime: .agent-workflow/runtime
  worktrees: .planning/worktrees
capabilities: {}
harness: claude
model_tiers:
  brainstorm: high_reasoning
  design: high_reasoning
  docs: cheap_simple
  implement: standard_impl
  plan: high_reasoning
  review: high_reasoning
  verify: standard_impl
policy:
  approval:
    bind_to_scope: true
    ttl_seconds: 86400
project:
  monorepo: false
  review: self_check
  review_ledger: false
  rigor: easy
  shape: library
  stack_intent: Python 3 generators (draw.io diagrams, HTML/PPTX decks, estimates)
    + Markdown Claude Code skills; tests with pytest
  stage: greenfield
  worktree: never
provider_mode: single
quick:
  max_files: 5
routing:
  circuit_breaker:
    failure_threshold: 3
  queue:
    max_wait_seconds: 600
  review:
    allow_self_review_fallback: false
    independence: session
    max_cycles: 2
    require_independent: true
    role: review
  roles:
    backend:
      preferred:
      - main_harness
    docs:
      preferred:
      - main_harness
    frontend:
      preferred:
      - main_harness
    general:
      preferred:
      - main_harness
    review:
      preferred:
      - main_harness
  worker:
    max_retries: 2
rules:
  packs:
  - core
  - python
schema_version: '2.7'
setup_cli_version: '2.7'
verify:
  checks:
    build: ''
    e2e: ''
    lint: .venv/bin/ruff check .
    test: .venv/bin/python -m pytest -q
    typecheck: ''
workflow_version: '2.7'
